<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soup Generator - Embed</title>
    <style>
        :root {
            --bg-swamp: #0e120c;
            --panel-bg: #1c2217;
            --panel-border: #35422b;
            --mud-dark: #2c2219;
            --accent-slime: #88c057;
            --accent-bubble: #b8e986;
            --accent-mud: #d99143;
            --accent-poison: #a335ee;
            --text-main: #e2e8dd;
            --text-sub: #7a8b6e;
        }

        body {
            font-family: 'Courier New', Courier, monospace, sans-serif;
            background-color: transparent;
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 10px;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            overflow: hidden;
            touch-action: none; /* מונע מחוות גלילה בכל העמוד */
        }

        .studio-rack {
            position: relative;
            z-index: 1;
            background: linear-gradient(180deg, var(--panel-bg) 0%, var(--mud-dark) 100%);
            width: 100%;
            max-width: 460px;
            padding: 18px;
            border-radius: 12px;
            border: 2px solid var(--panel-border);
            box-shadow: 0 15px 40px rgba(0,0,0,0.8), inset 0 1px 2px rgba(184, 233, 134, 0.15);
            direction: ltr;
            box-sizing: border-box;
            touch-action: none;
        }

        .rack-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px dashed var(--panel-border);
            padding-bottom: 8px;
            margin-bottom: 12px;
        }

        .rack-title {
            font-size: 0.95em;
            font-weight: 900;
            letter-spacing: 1px;
            color: var(--accent-bubble);
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 8px;
            text-shadow: 0 0 6px rgba(136, 192, 87, 0.3);
        }

        .status-led {
            width: 8px;
            height: 8px;
            background-color: var(--accent-slime);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--accent-slime);
            transition: background-color 0.2s;
        }

        .status-led.off {
            background-color: #333;
            box-shadow: none;
        }

        .rack-section {
            background: rgba(14, 18, 12, 0.5);
            border: 1px solid rgba(136, 192, 87, 0.15);
            border-radius: 8px;
            padding: 10px 12px;
            margin-bottom: 10px;
        }

        .section-label {
            font-size: 0.6em;
            font-weight: 700;
            letter-spacing: 1px;
            color: var(--text-sub);
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .controls-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        .controls-grid-4 {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
        }

        .control-block {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .control-block label {
            font-size: 0.55em;
            font-weight: 700;
            color: var(--text-sub);
            margin-bottom: 4px;
            height: 14px;
            display: flex;
            align-items: center;
            text-align: center;
        }

        .knob-container {
            position: relative;
            width: 40px;
            height: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 2px 0;
            touch-action: none; /* מונע גלילת מסך בנגיעה בכפתור */
        }

        .knob-dial {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: linear-gradient(145deg, #2b3623, #151a11);
            box-shadow: 2px 2px 6px rgba(0,0,0,0.6), -1px -1px 3px rgba(255,255,255,0.05);
            position: relative;
            cursor: ns-resize;
            transition: transform 0.04s ease-out;
            border: 1px solid rgba(136, 192, 87, 0.2);
            touch-action: none;
        }

        .knob-marker {
            position: absolute;
            top: 4px;
            left: 50%;
            transform: translateX(-50%);
            width: 3px;
            height: 7px;
            background-color: var(--accent-slime);
            border-radius: 2px;
            box-shadow: 0 0 4px var(--accent-slime);
        }

        .knob-marker.mud {
            background-color: var(--accent-mud);
            box-shadow: 0 0 4px var(--accent-mud);
        }

        .readout {
            font-size: 0.6em;
            font-family: monospace;
            color: var(--accent-bubble);
            margin-top: 4px;
            font-weight: 600;
        }

        .btn-trigger {
            background: linear-gradient(145deg, var(--accent-mud), #a3621f);
            color: #0e120c;
            border: none;
            padding: 7px 10px;
            border-radius: 14px;
            font-size: 0.6em;
            font-weight: 900;
            letter-spacing: 0.5px;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(217, 145, 67, 0.4);
            text-transform: uppercase;
        }

        .btn-trigger:active { transform: translateY(1px) scale(0.97); }

        .btn-power {
            background: #231b17;
            color: var(--accent-poison);
            border: 1px solid var(--accent-poison);
            padding: 6px 10px;
            border-radius: 4px;
            font-size: 0.6em;
            font-weight: 800;
            cursor: pointer;
            letter-spacing: 0.5px;
            box-shadow: 0 0 6px rgba(163, 53, 238, 0.2);
            transition: all 0.2s;
        }

        .btn-power.active {
            background: var(--accent-poison);
            color: #fff;
            box-shadow: 0 0 10px rgba(163, 53, 238, 0.6);
        }

        .master-block {
            background: rgba(136, 192, 87, 0.05);
            border: 1px solid rgba(136, 192, 87, 0.25);
            margin-bottom: 0;
        }
    </style>
</head>
<body>

<div class="studio-rack">
    <div class="rack-header">
        <div class="rack-title">
            <div class="status-led" id="statusLed"></div>
            🥣 SOUP GENERATOR
        </div>
    </div>

    <!-- Generator -->
    <div class="rack-section">
        <div class="section-label">01 // Soup Ingredients</div>
        <div class="controls-grid">
            <div class="control-block">
                <label>STIR THE SOUP</label>
                <button class="btn-trigger" onclick="triggerSound()">SPLASH</button>
                <div class="readout" id="freqDisp" style="margin-top: 6px;">-- Hz</div>
            </div>
            <div class="control-block">
                <label>ATTACK</label>
                <div class="knob-container">
                    <div class="knob-dial" id="knobEnvelope"><div class="knob-marker"></div></div>
                </div>
                <div class="readout" id="envDisp">100 ms</div>
            </div>
            <div class="control-block">
                <label>MUD FILTER</label>
                <div class="knob-container">
                    <div class="knob-dial" id="knobLpf"><div class="knob-marker mud"></div></div>
                </div>
                <div class="readout" id="lpfDisp">5000 Hz</div>
            </div>
        </div>
    </div>

    <!-- Delay & Pan -->
    <div class="rack-section">
        <div class="section-label">02 // Echo & Residue</div>
        <div class="controls-grid-4">
            <div class="control-block">
                <label>DELAY</label>
                <div class="knob-container">
                    <div class="knob-dial" id="knobTime"><div class="knob-marker"></div></div>
                </div>
                <div class="readout" id="timeDisp">0.40s</div>
            </div>
            <div class="control-block">
                <label>FEEDBACK</label>
                <div class="knob-container">
                    <div class="knob-dial" id="knobDuration"><div class="knob-marker"></div></div>
                </div>
                <div class="readout" id="durDisp">50%</div>
            </div>
            <div class="control-block">
                <label>RESIDUE VOL</label>
                <div class="knob-container">
                    <div class="knob-dial" id="knobEchoVol"><div class="knob-marker mud"></div></div>
                </div>
                <div class="readout" id="echoVolDisp">80%</div>
            </div>
            <div class="control-block">
                <label>PING-PONG</label>
                <div class="knob-container">
                    <div class="knob-dial" id="knobPanning"><div class="knob-marker"></div></div>
                </div>
                <div class="readout" id="panDisp">0%</div>
            </div>
        </div>
    </div>

    <!-- Modulation & FX -->
    <div class="rack-section">
        <div class="section-label">03 // Swamp Modulation</div>
        <div class="controls-grid">
            <div class="control-block">
                <label>PITCH SHIFT</label>
                <div class="knob-container">
                    <div class="knob-dial" id="knobPitch"><div class="knob-marker mud"></div></div>
                </div>
                <div class="readout" id="pitchDisp">0 st</div>
            </div>
            <div class="control-block">
                <label>REVERB</label>
                <div class="knob-container">
                    <div class="knob-dial" id="knobReverb"><div class="knob-marker"></div></div>
                </div>
                <div class="readout" id="verbDisp">0%</div>
            </div>
            <div class="control-block">
                <label>CHAOS</label>
                <div class="knob-container">
                    <div class="knob-dial" id="knobChaos"><div class="knob-marker"></div></div>
                </div>
                <div class="readout" id="chaosDisp">Off</div>
            </div>
        </div>
    </div>

    <!-- Master & Power -->
    <div class="rack-section master-block">
        <div class="controls-grid" style="grid-template-columns: 2fr 1fr;">
            <div class="control-block">
                <label>SOUP MASTER</label>
                <div class="knob-container">
                    <div class="knob-dial" id="knobMaster"><div class="knob-marker mud"></div></div>
                </div>
                <div class="readout" id="masterDisp" style="color: var(--accent-mud);">80%</div>
            </div>
            <div class="control-block" style="justify-content: center;">
                <label>HEAT</label>
                <button class="btn-power active" id="powerBtn" onclick="togglePower()">ON</button>
            </div>
        </div>
    </div>
</div>

<script>
    let audioCtx = null;
    
    // Nodes
    let delayL = null;
    let delayR = null;
    let feedbackL = null;
    let feedbackR = null;
    let pannerL = null;
    let pannerR = null;
    let echoVolGain = null;

    let lpfFilterNode = null;
    let highPassFilter = null;
    let lowPassSafetyFilter = null;
    let masterGainNode = null;
    let waveShaperNode = null;
    let limiterNode = null;

    let isPoweredOn = true;
    let isFirstTrigger = true;
    let chaosInterval = null;

    const params = {
        envelope: 100,  
        lpf: 5000,      
        time: 0.4,      
        duration: 70,   
        echoVol: 80,    
        panning: 0,     
        pitch: 0,       
        reverb: 0,      
        chaos: 0,       
        master: 80      
    };

    function makeDegradeCurve() {
        const k = 20;
        const n_samples = 44100;
        const curve = new Float32Array(n_samples);
        const deg = Math.PI / 180;
        for (let i = 0; i < n_samples; ++i) {
            let x = (i * 2) / n_samples - 1;
            curve[i] = ((3 + k) * x * 20 * deg) / (Math.PI + k * Math.abs(x));
        }
        return curve;
    }

    function initAudioEngine() {
        if (audioCtx) return;

        audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        delayL = audioCtx.createDelay(5.0);
        delayR = audioCtx.createDelay(5.0);
        feedbackL = audioCtx.createGain();
        feedbackR = audioCtx.createGain();
        echoVolGain = audioCtx.createGain();

        pannerL = audioCtx.createStereoPanner();
        pannerR = audioCtx.createStereoPanner();

        waveShaperNode = audioCtx.createWaveShaper();
        waveShaperNode.curve = makeDegradeCurve();

        lpfFilterNode = audioCtx.createBiquadFilter();
        lpfFilterNode.type = "lowpass";
        lpfFilterNode.frequency.value = params.lpf;

        highPassFilter = audioCtx.createBiquadFilter();
        highPassFilter.type = "highpass";
        highPassFilter.frequency.value = 100;

        lowPassSafetyFilter = audioCtx.createBiquadFilter();
        lowPassSafetyFilter.type = "lowpass";
        lowPassSafetyFilter.frequency.value = 5000;

        limiterNode = audioCtx.createDynamicsCompressor();
        limiterNode.threshold.setValueAtTime(-6.0, audioCtx.currentTime);
        limiterNode.knee.setValueAtTime(0.0, audioCtx.currentTime);
        limiterNode.ratio.setValueAtTime(20.0, audioCtx.currentTime);
        limiterNode.attack.setValueAtTime(0.001, audioCtx.currentTime);
        limiterNode.release.setValueAtTime(0.1, audioCtx.currentTime);

        masterGainNode = audioCtx.createGain();

        delayL.connect(pannerL);
        pannerL.connect(feedbackL);
        feedbackL.connect(delayR);

        delayR.connect(pannerR);
        pannerR.connect(feedbackR);
        feedbackR.connect(delayL);

        pannerL.connect(echoVolGain);
        pannerR.connect(echoVolGain);

        echoVolGain.connect(waveShaperNode);
        waveShaperNode.connect(lpfFilterNode);
        lpfFilterNode.connect(highPassFilter);
        highPassFilter.connect(lowPassSafetyFilter);
        
        lowPassSafetyFilter.connect(masterGainNode);
        masterGainNode.connect(limiterNode);
        limiterNode.connect(audioCtx.destination);
    }

    function updateAudioParams() {
        if (!audioCtx) return;

        const now = audioCtx.currentTime;

        if (!isPoweredOn) {
            masterGainNode.gain.setTargetAtTime(0, now, 0.01);
            return;
        }

        const pitchFactor = Math.pow(2, params.pitch / 12);

        const baseTime = params.time;
        delayL.delayTime.setTargetAtTime(baseTime / pitchFactor, now, 0.05);
        delayR.delayTime.setTargetAtTime(baseTime / pitchFactor, now, 0.05);

        const fbGain = (params.duration / 100) * 0.96;
        feedbackL.gain.setTargetAtTime(fbGain, now, 0.03);
        feedbackR.gain.setTargetAtTime(fbGain, now, 0.03);

        echoVolGain.gain.setTargetAtTime(params.echoVol / 100, now, 0.03);

        const width = params.panning / 100;
        pannerL.pan.setTargetAtTime(-width, now, 0.03);
        pannerR.pan.setTargetAtTime(width, now, 0.03);

        lpfFilterNode.frequency.setTargetAtTime(params.lpf, now, 0.02);
        masterGainNode.gain.setTargetAtTime((params.master / 100) * 0.6, now, 0.03);

        clearInterval(chaosInterval);
        if (params.chaos > 0 && isPoweredOn) {
            chaosInterval = setInterval(() => {
                if (!audioCtx) return;
                const jitter = (Math.random() - 0.5) * (params.chaos / 100) * 0.35;
                const targetTime = Math.max(0.02, (params.time + jitter) / pitchFactor);
                delayL.delayTime.setTargetAtTime(targetTime, audioCtx.currentTime, 0.03);
                delayR.delayTime.setTargetAtTime(targetTime, audioCtx.currentTime, 0.03);
            }, 100 - (params.chaos * 0.8));
        }
    }

    function togglePower() {
        isPoweredOn = !isPoweredOn;
        const btn = document.getElementById('powerBtn');
        const led = document.getElementById('statusLed');
        
        if (isPoweredOn) {
            btn.innerText = "ON";
            btn.classList.add('active');
            led.classList.remove('off');
        } else {
            btn.innerText = "OFF";
            btn.classList.remove('active');
            led.classList.add('off');
        }
        updateAudioParams();
    }

    function updateUI() {
        setKnobRotation('knobEnvelope', params.envelope, 100, 2000);
        document.getElementById('envDisp').innerText = Math.round(params.envelope) + " ms";

        setKnobRotation('knobLpf', params.lpf, 100, 10000);
        document.getElementById('lpfDisp').innerText = Math.round(params.lpf) + " Hz";

        setKnobRotation('knobTime', params.time, 0.05, 2.5);
        document.getElementById('timeDisp').innerText = params.time.toFixed(2) + "s";

        setKnobRotation('knobDuration', params.duration, 1, 100);
        document.getElementById('durDisp').innerText = Math.round(params.duration) + "%";

        setKnobRotation('knobEchoVol', params.echoVol, 0, 100);
        document.getElementById('echoVolDisp').innerText = Math.round(params.echoVol) + "%";

        setKnobRotation('knobPanning', params.panning, 0, 100);
        const panVal = Math.round(params.panning);
        document.getElementById('panDisp').innerText = panVal === 0 ? "0%" : `${panVal}%`;

        setKnobRotation('knobPitch', params.pitch, -24, 24);
        const p = Math.round(params.pitch);
        document.getElementById('pitchDisp').innerText = (p > 0 ? "+" : "") + p + " st";

        setKnobRotation('knobReverb', params.reverb, 0, 100);
        document.getElementById('verbDisp').innerText = Math.round(params.reverb) + "%";

        setKnobRotation('knobChaos', params.chaos, 0, 100);
        const c = Math.round(params.chaos);
        document.getElementById('chaosDisp').innerText = c > 0 ? `${c}%` : "Off";

        setKnobRotation('knobMaster', params.master, 0, 100);
        document.getElementById('masterDisp').innerText = Math.round(params.master) + "%";

        updateAudioParams();
    }

    function setKnobRotation(id, val, min, max) {
        const angle = ((val - min) / (max - min)) * 270 - 135;
        document.getElementById(id).style.transform = `rotate(${angle}deg)`;
    }

    function setupKnobDrag(id, min, max, paramKey, step = 1) {
        const knob = document.getElementById(id);
        let isDragging = false;
        let startY = 0;
        let startVal = 0;

        function handleStart(e) {
            isDragging = true;
            startY = e.touches ? e.touches[0].clientY : e.clientY;
            startVal = params[paramKey];
        }

        function handleMove(e) {
            if (!isDragging) return;
            
            // מניעת גלילה בטלפון בזמן הזזת הכפתור
            if (e.cancelable) e.preventDefault();
            e.stopPropagation();

            const currentY = e.touches ? e.touches[0].clientY : e.clientY;
            const deltaY = startY - currentY;

            const range = max - min;
            let val = startVal + deltaY * range * 0.004;

            val = Math.min(max, Math.max(min, val));
            if (step >= 1) val = Math.round(val);
            params[paramKey] = val;

            updateUI();
        }

        function handleEnd(e) { 
            isDragging = false; 
        }

        // Mouse Events
        knob.addEventListener('mousedown', handleStart);
        document.addEventListener('mousemove', handleMove);
        document.addEventListener('mouseup', handleEnd);

        // Touch Events עם ביטול גלילה מפורש
        knob.addEventListener('touchstart', (e) => {
            if (e.cancelable) e.preventDefault();
            e.stopPropagation();
            handleStart(e);
        }, { passive: false });

        document.addEventListener('touchmove', (e) => {
            if (isDragging) {
                if (e.cancelable) e.preventDefault();
                e.stopPropagation();
                handleMove(e);
            }
        }, { passive: false });

        document.addEventListener('touchend', handleEnd, { passive: false });
    }

    function playSingleNote(freq, delayOffset) {
        if (!audioCtx) return;

        const now = audioCtx.currentTime + delayOffset;

        const osc = audioCtx.createOscillator();
        const env = audioCtx.createGain();

        osc.type = 'sine';

        const pitchFactor = Math.pow(2, params.pitch / 12);
        osc.frequency.setValueAtTime(freq * pitchFactor, now);

        const totalDuration = params.envelope / 1000;
        const attackTime = totalDuration * 0.25;
        const releaseTime = totalDuration * 0.75;

        env.gain.setValueAtTime(0.0001, now);
        env.gain.linearRampToValueAtTime(0.4, now + attackTime);
        env.gain.exponentialRampToValueAtTime(0.0001, now + attackTime + releaseTime);

        osc.connect(env);
        env.connect(masterGainNode);
        env.connect(delayL);

        osc.start(now);
        osc.stop(now + totalDuration + 0.05);
    }

    function triggerSound() {
        if (!isPoweredOn) return;
        initAudioEngine();
        if (audioCtx.state === 'suspended') audioCtx.resume();

        const count = Math.floor(Math.random() * 3) + 3;
        let displayFreqs = [];

        for (let i = 0; i < count; i++) {
            let freq;
            if (isFirstTrigger && i === 0) {
                freq = 120;
                isFirstTrigger = false;
            } else {
                freq = Math.floor(Math.random() * (600 - 120 + 1)) + 120;
            }
            displayFreqs.push(freq);
            
            const timeOffset = i * (0.04 + Math.random() * 0.04);
            playSingleNote(freq, timeOffset);
        }

        document.getElementById('freqDisp').innerText = displayFreqs.join(',') + "Hz";
    }

    setupKnobDrag('knobEnvelope', 100, 2000, 'envelope', 10);
    setupKnobDrag('knobLpf', 100, 10000, 'lpf', 10);
    setupKnobDrag('knobTime', 0.05, 2.5, 'time', 0.01);
    setupKnobDrag('knobDuration', 1, 100, 'duration', 1);
    setupKnobDrag('knobEchoVol', 0, 100, 'echoVol', 1);
    setupKnobDrag('knobPanning', 0, 100, 'panning', 1);
    setupKnobDrag('knobPitch', -24, 24, 'pitch', 1);
    setupKnobDrag('knobReverb', 0, 100, 'reverb', 1);
    setupKnobDrag('knobChaos', 0, 100, 'chaos', 1);
    setupKnobDrag('knobMaster', 0, 100, 'master', 1);

    updateUI();
</script>

</body>
</html>
