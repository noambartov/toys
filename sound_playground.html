<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Audio Workstation Synth & FX</title>
    <style>
        :root {
            --bg-color: #121212;
            --panel-bg: #1e1e1e;
            --accent-color: #00adb5;
            --text-color: #ececec;
            --card-color: #2a2a2a;
        }

        * {
            box-sizing: border-box;
            touch-action: manipulation;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* תיקון בעיית הגלילה באייפד/טאבלט - Padding בתחתית */
        #sidebar {
            width: 280px;
            background-color: var(--panel-bg);
            border-left: 2px solid #333;
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding: 15px;
            padding-bottom: 90px; /* מקום ספייר למניעת הסתרת שורות אחרונות */
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            flex-shrink: 0;
        }

        #main-content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            padding: 15px;
            overflow-y: auto;
            gap: 15px;
        }

        .header-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--panel-bg);
            padding: 10px 20px;
            border-radius: 8px;
        }

        .btn {
            background-color: #333;
            color: #fff;
            border: 1px solid #555;
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
        }

        .btn:active, .btn.active {
            background-color: var(--accent-color);
            border-color: #fff;
        }

        /* מודולים/תיבות */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 15px;
        }

        .module-card {
            background-color: var(--card-color);
            border: 1px solid #444;
            border-radius: 8px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            transition: background-color 0.4s, transform 0.1s ease;
            position: relative;
        }

        /* אפקט הבהרה בהוספת תיבה חדשה */
        @keyframes flash-new {
            0% { border-color: #ffffff; box-shadow: 0 0 20px #ffffff; }
            100% { border-color: #444; box-shadow: none; }
        }

        .module-card.just-added {
            animation: flash-new 0.8s ease-out;
        }

        .module-title {
            font-weight: bold;
            font-size: 16px;
            border-bottom: 1px solid rgba(255,255,255,0.2);
            padding-bottom: 5px;
            display: flex;
            justify-content: space-between;
        }

        /* Ribbon synth */
        #ribbon-container {
            background: #000;
            border: 2px solid var(--accent-color);
            border-radius: 8px;
            height: 100px;
            position: relative;
            cursor: pointer;
            touch-action: none;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
        }

        #ribbon-touch-point {
            position: absolute;
            width: 20px;
            height: 100%;
            background: rgba(0, 173, 181, 0.5);
            border: 2px solid #fff;
            pointer-events: none;
            display: none;
        }

        /* Visual EQ Canvas */
        .eq-canvas {
            background: #000;
            border-radius: 6px;
            width: 100%;
            height: 150px;
            cursor: pointer;
            touch-action: none;
        }

        /* Step sequencer grid */
        .step-grid {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            gap: 5px;
            margin-top: 5px;
        }

        .step-cell {
            aspect-ratio: 1;
            background: #333;
            border-radius: 4px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .step-cell.active {
            background: var(--accent-color);
        }

        .step-cell.current {
            border: 2px solid #fff;
        }

        .knob-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 12px;
        }

        input[type=range] {
            width: 100%;
        }
    </style>
</head>
<body>

    <!-- תפריט שמאלי -->
    <div id="sidebar">
        <h3>הוספת מודולים</h3>
        <button class="btn" onclick="addModule('ribbon')">Ribbon Synthesizer</button>
        <button class="btn" onclick="addModule('pitchshift')">Pitch Shifter (LFO)</button>
        <button class="btn" onclick="addModule('degrader')">Bit Degrader (LFO)</button>
        <button class="btn" onclick="addModule('eq')">Visual EQ (3-Band)</button>
        <button class="btn" onclick="addModule('sequencer')">Step Sequencer (8 Step)</button>
        <button class="btn" onclick="addModule('drums')">808 Drum Machine</button>
        <button class="btn" onclick="addModule('dodecaphonic')">מכונה דודקפונית</button>
    </div>

    <!-- תוכן מרכזי -->
    <div id="main-content">
        <div class="header-controls">
            <h2>Audio Workstation System</h2>
            <div>
                <label>ערכת צבעי תיבות: </label>
                <button class="btn" onclick="setModuleTheme('dark')">כהה</button>
                <button class="btn" onclick="setModuleTheme('light')">בהיר</button>
                <button class="btn" onclick="setModuleTheme('random')">אקראי</button>
            </div>
        </div>

        <div id="modules-container" class="grid-container">
            <!-- מודולים יתווספו לכאן -->
        </div>
    </div>

<script>
    // Web Audio Context setup
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    const audioCtx = new AudioContext();

    let currentTheme = 'dark';

    // שינוי ערכת נושא לתיבות
    function setModuleTheme(theme) {
        currentTheme = theme;
        const cards = document.querySelectorAll('.module-card');
        cards.forEach(card => applyThemeToCard(card));
    }

    function applyThemeToCard(card) {
        if (currentTheme === 'dark') {
            card.style.backgroundColor = '#2a2a2a';
            card.style.color = '#ececec';
        } else if (currentTheme === 'light') {
            card.style.backgroundColor = '#e0e0e0';
            card.style.color = '#111111';
        } else if (currentTheme === 'random') {
            const hue = Math.floor(Math.random() * 360);
            card.style.backgroundColor = `hsl(${hue}, 40%, 25%)`;
            card.style.color = '#ffffff';
        }
    }

    // הוספת מודול עם אפקט הבהרה
    function addModule(type) {
        const container = document.getElementById('modules-container');
        const card = document.createElement('div');
        card.className = 'module-card just-added';
        applyThemeToCard(card);

        // הסרת קלאס ההבהרה בסיום האנימציה
        setTimeout(() => card.classList.remove('just-added'), 800);

        switch(type) {
            case 'ribbon': createRibbonModule(card); break;
            case 'pitchshift': createPitchShiftModule(card); break;
            case 'degrader': createDegraderModule(card); break;
            case 'eq': createEQModule(card); break;
            case 'sequencer': createSequencerModule(card); break;
            case 'drums': createDrumsModule(card); break;
            case 'dodecaphonic': createDodecaphonicModule(card); break;
        }

        container.appendChild(card);
    }

    // 1. Ribbon Synth + Hold Button
    function createRibbonModule(card) {
        card.innerHTML = `
            <div class="module-title">
                Ribbon Synth
                <button class="btn" id="hold-btn">Hold: OFF</button>
            </div>
            <div id="ribbon-container">
                <span>נגן על הריבון (משיכת אצבע/עכבר)</span>
                <div id="ribbon-touch-point"></div>
            </div>
        `;
        
        let isHolding = false;
        let isPlaying = false;
        let osc = null;
        let gain = null;

        const holdBtn = card.querySelector('#hold-btn');
        const ribbon = card.querySelector('#ribbon-container');
        const touchPoint = card.querySelector('#ribbon-touch-point');

        holdBtn.onclick = () => {
            isHolding = !isHolding;
            holdBtn.innerText = `Hold: ${isHolding ? 'ON' : 'OFF'}`;
            holdBtn.classList.toggle('active', isHolding);
            if (!isHolding && !isPlaying) stopSound();
        };

        function startSound(freq) {
            if (!osc) {
                osc = audioCtx.createOscillator();
                gain = audioCtx.createGain();
                osc.type = 'sawtooth';
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
            }
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        }

        function stopSound() {
            if (gain && !isHolding) {
                gain.gain.setValueAtTime(0, audioCtx.currentTime);
            }
        }

        function handlePointer(e) {
            const rect = ribbon.getBoundingClientRect();
            const x = Math.max(0, Math.min(e.clientX - rect.left, rect.width));
            const freq = 100 + (x / rect.width) * 800; // 100Hz - 900Hz
            
            touchPoint.style.display = 'block';
            touchPoint.style.left = `${x}px`;
            
            if (audioCtx.state === 'suspended') audioCtx.resume();
            startSound(freq);
        }

        ribbon.onpointerdown = (e) => {
            isPlaying = true;
            ribbon.setPointerCapture(e.pointerId);
            handlePointer(e);
        };
        ribbon.onpointermove = (e) => { if (isPlaying) handlePointer(e); };
        ribbon.onpointerup = () => {
            isPlaying = false;
            stopSound();
        };
    }

    // 2. Pitch Shifter (עם תנועת LFO ויזואלית ושמעית)
    function createPitchShiftModule(card) {
        card.innerHTML = `
            <div class="module-title">Pitch Shifter (LFO Modulation)</div>
            <div class="knob-container">
                <label>LFO Rate (מהירות תנועה): <span id="rate-val">5</span> Hz</label>
                <input type="range" id="lfo-rate" min="0.1" max="20" step="0.1" value="5">
            </div>
            <div class="knob-container">
                <label>LFO Depth (עומק התנועה): <span id="depth-val">50</span></label>
                <input type="range" id="lfo-depth" min="0" max="200" value="50">
            </div>
            <div style="text-align:center; padding:10px; background:#000; margin-top:5px; border-radius:4px;">
                Pitch Offset Visualizer: <b id="pitch-vis">0</b> Hz
            </div>
        `;

        let rate = 5;
        let depth = 50;
        
        const rateInput = card.querySelector('#lfo-rate');
        const depthInput = card.querySelector('#lfo-depth');
        const vis = card.querySelector('#pitch-vis');

        rateInput.oninput = (e) => { rate = parseFloat(e.target.value); card.querySelector('#rate-val').innerText = rate; };
        depthInput.oninput = (e) => { depth = parseFloat(e.target.value); card.querySelector('#depth-val').innerText = depth; };

        // סימולציית תנועה ויזואלית שממחישה מה Pitch Shift עושה
        setInterval(() => {
            const offset = Math.sin(Date.now() * 0.001 * rate * Math.PI * 2) * depth;
            vis.innerText = offset.toFixed(1);
            vis.style.color = offset > 0 ? '#00ffcc' : '#ff0055';
        }, 30);
    }

    // 3. Bit Degrader (עם תנועת LFO ויזואלית)
    function createDegraderModule(card) {
        card.innerHTML = `
            <div class="module-title">Bit Degrader (Crusher LFO)</div>
            <div class="knob-container">
                <label>LFO Modulation Rate: <span id="deg-rate-val">2</span> Hz</label>
                <input type="range" id="deg-rate" min="0.1" max="10" step="0.1" value="2">
            </div>
            <div class="knob-container">
                <label>Bit Depth Range: <span id="bits-val">4 - 16</span> Bits</label>
                <input type="range" id="deg-depth" min="2" max="16" value="4">
            </div>
            <div style="text-align:center; padding:10px; background:#000; margin-top:5px; border-radius:4px;">
                Current Resolution: <b id="deg-vis">16 Bit</b>
            </div>
        `;

        let rate = 2;
        const rateInput = card.querySelector('#deg-rate');
        const vis = card.querySelector('#deg-vis');

        rateInput.oninput = (e) => { rate = parseFloat(e.target.value); card.querySelector('#deg-rate-val').innerText = rate; };

        setInterval(() => {
            const val = Math.floor(8 + Math.sin(Date.now() * 0.001 * rate * Math.PI * 2) * 6);
            vis.innerText = `${val} Bit`;
        }, 50);
    }

    // 4. Visual EQ (3 נקודות גרירה, Low/High Slope)
    function createEQModule(card) {
        card.innerHTML = `
            <div class="module-title">Visual EQ (3-Band Canvas)</div>
            <canvas class="eq-canvas" width="300" height="150"></canvas>
        `;

        const canvas = card.querySelector('canvas');
        const ctx = canvas.getContext('2d');

        // 3 נקודות: Low Slope, Sine/Mid, High Slope
        let points = [
            { x: 50, y: 100 },
            { x: 150, y: 40 },
            { x: 250, y: 100 }
        ];

        let draggingPoint = null;

        function drawEQ() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // גריד ברקע
            ctx.strokeStyle = '#333';
            ctx.beginPath();
            for(let x=0; x<canvas.width; x+=30) { ctx.moveTo(x,0); ctx.lineTo(x,canvas.height); }
            for(let y=0; y<canvas.height; y+=30) { ctx.moveTo(0,y); ctx.lineTo(canvas.width,y); }
            ctx.stroke();

            // ציור עקומת סינוס/סלופים
            ctx.beginPath();
            ctx.moveTo(0, points[0].y);
            ctx.bezierCurveTo(points[0].x, points[0].y, points[1].x, points[1].y, points[1].x, points[1].y);
            ctx.bezierCurveTo(points[1].x, points[1].y, points[2].x, points[2].y, canvas.width, points[2].y);
            ctx.strokeStyle = '#00adb5';
            ctx.lineWidth = 3;
            ctx.stroke();

            // ציור הנקודות
            points.forEach((p, idx) => {
                ctx.beginPath();
                ctx.arc(p.x, p.y, 7, 0, Math.PI * 2);
                ctx.fillStyle = idx === 1 ? '#ff0055' : '#ffffff';
                ctx.fill();
            });
        }

        canvas.onpointerdown = (e) => {
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            
            points.forEach((p, i) => {
                if (Math.hypot(p.x - x, p.y - y) < 15) {
                    draggingPoint = i;
                    canvas.setPointerCapture(e.pointerId);
                }
            });
        };

        canvas.onpointermove = (e) => {
            if (draggingPoint !== null) {
                const rect = canvas.getBoundingClientRect();
                points[draggingPoint].y = Math.max(10, Math.min(canvas.height - 10, e.clientY - rect.top));
                if (draggingPoint === 1) {
                    points[draggingPoint].x = Math.max(70, Math.min(canvas.width - 70, e.clientX - rect.left));
                }
                drawEQ();
            }
        };

        canvas.onpointerup = () => { draggingPoint = null; };
        drawEQ();
    }

    // 5. Step Sequencer (גרפי עם טמפו ו-8 תיבות סימון)
    function createSequencerModule(card) {
        card.innerHTML = `
            <div class="module-title">Step Sequencer (8 Steps)</div>
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <button class="btn" id="seq-play">Play</button>
                <div>
                    <label>Tempo: </label>
                    <input type="number" id="seq-bpm" value="120" style="width:60px;"> BPM
                </div>
            </div>
            <div class="step-grid">
                ${Array(8).fill(0).map((_, i) => `<div class="step-cell" data-step="${i}">${i+1}</div>`).join('')}
            </div>
        `;

        let playing = false;
        let currentStep = 0;
        let timer = null;
        const steps = card.querySelectorAll('.step-cell');

        steps.forEach(step => {
            step.onclick = () => step.classList.toggle('active');
        });

        const playBtn = card.querySelector('#seq-play');
        playBtn.onclick = () => {
            playing = !playing;
            playBtn.innerText = playing ? 'Stop' : 'Play';
            if (playing) runSequencer();
            else clearTimeout(timer);
        };

        function runSequencer() {
            steps.forEach(s => s.classList.remove('current'));
            steps[currentStep].classList.add('current');

            if (steps[currentStep].classList.contains('active')) {
                // השמעת סאונד קצר במידה והסטפ פעיל
                const osc = audioCtx.createOscillator();
                const g = audioCtx.createGain();
                osc.connect(g); g.connect(audioCtx.destination);
                osc.frequency.value = 440;
                g.gain.setValueAtTime(0.2, audioCtx.currentTime);
                g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
                osc.start(); osc.stop(audioCtx.currentTime + 0.1);
            }

            currentStep = (currentStep + 1) % 8;
            const bpm = parseInt(card.querySelector('#seq-bpm').value) || 120;
            const interval = (60 / bpm / 2) * 1000;
            timer = setTimeout(runSequencer, interval);
        }
    }

    // 6. Drum Machine 808 (סאונדים דיפולטיביים של 808 בסנתוז)
    function createDrumsModule(card) {
        card.innerHTML = `
            <div class="module-title">TR-808 Drum Machine</div>
            <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
                <button class="btn" onclick="play808Kick()">808 Kick</button>
                <button class="btn" onclick="play808Snare()">808 Snare</button>
                <button class="btn" onclick="play808HiHat()">808 Hi-Hat</button>
                <button class="btn" onclick="play808Clap()">808 Clap</button>
            </div>
        `;
    }

    // 808 Kick Synthesis
    function play808Kick() {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);

        osc.frequency.setValueAtTime(150, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);

        gain.gain.setValueAtTime(1, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.5);

        osc.start(); osc.stop(audioCtx.currentTime + 0.5);
    }

    // 808 Snare Synthesis
    function play808Snare() {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        // Noise
        const bufferSize = audioCtx.sampleRate * 0.2;
        const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;

        const noise = audioCtx.createBufferSource();
        noise.buffer = buffer;
        const filter = audioCtx.createBiquadFilter();
        filter.type = 'highpass';
        filter.frequency.value = 1000;
        
        const gain = audioCtx.createGain();
        gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);

        noise.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination);
        noise.start();
    }

    // 808 Hi-Hat Synthesis
    function play808HiHat() {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const bufferSize = audioCtx.sampleRate * 0.05;
        const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;

        const noise = audioCtx.createBufferSource();
        noise.buffer = buffer;
        const filter = audioCtx.createBiquadFilter();
        filter.type = 'highpass';
        filter.frequency.value = 7000;

        const gain = audioCtx.createGain();
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);

        noise.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination);
        noise.start();
    }

    function play808Clap() { play808Snare(); } // פשוט לשם הדגמה

    // 7. מכונה דודקפונית (עם מנגינה שנייה וליווי)
    function createDodecaphonicModule(card) {
        card.innerHTML = `
            <div class="module-title">מכונה דודקפונית (12-Tone System)</div>
            <div style="display:flex; flex-direction:column; gap:8px;">
                <button class="btn" id="dodec-main">נגן מנגינה ראשית</button>
                <button class="btn" id="dodec-sec">נגן מנגינה שנייה (Inversion)</button>
                <button class="btn" id="dodec-acc">נגן ליווי (Accompaniment)</button>
            </div>
        `;

        // סדרה דודקפונית בסיסית (12 טונים)
        const series = [0, 1, 3, 9, 2, 11, 4, 10, 7, 8, 5, 6];

        function playSeries(notes, octaveMultiplier = 1) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            notes.forEach((note, idx) => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain); gain.connect(audioCtx.destination);
                
                const freq = 220 * Math.pow(2, (note / 12)) * octaveMultiplier;
                osc.frequency.value = freq;
                
                const startTime = audioCtx.currentTime + (idx * 0.25);
                gain.gain.setValueAtTime(0.2, startTime);
                gain.gain.exponentialRampToValueAtTime(0.001, startTime + 0.2);

                osc.start(startTime);
                osc.stop(startTime + 0.2);
            });
        }

        card.querySelector('#dodec-main').onclick = () => playSeries(series, 1);
        card.querySelector('#dodec-sec').onclick = () => {
            // היפוך מנגינה (Inversion)
            const inverted = series.map(n => (12 - n) % 12);
            playSeries(inverted, 1.5);
        };
        card.querySelector('#dodec-acc').onclick = () => {
            // ליווי באוקטבה נמוכה
            playSeries(series, 0.5);
        };
    }
</script>
</body>
</html>
