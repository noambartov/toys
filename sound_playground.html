<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>MODULARLAB - Infinite Canvas & DSP Synth</title>
    <style>
        :root {
            --bg-dark: #0b0c10;
            --panel-bg: #13151c;
            --sidebar-bg: #161822;
            --border-color: #242836;
            --accent-pink: #ff2a74;
            --accent-cyan: #00f0ff;
            --accent-yellow: #ffe600;
            --accent-green: #00e676;
            --accent-red: #ff3344;
            --accent-purple: #af52de;
            --text-main: #e0e6ed;
            --text-muted: #626c80;
        }

        /* Light Grid Theme */
        body.grid-light-theme #viewport {
            background-color: #e5e9f0 !important;
        }
        body.grid-light-theme .infinite-grid {
            background-image: linear-gradient(rgba(0, 0, 0, 0.1) 1px, transparent 1px), 
                              linear-gradient(90deg, rgba(0, 0, 0, 0.1) 1px, transparent 1px) !important;
        }

        html, body {
            width: 100vw; height: 100vh;
            overflow: hidden; 
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
            position: fixed; top: 0; left: 0;
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
            box-sizing: border-box; margin: 0; padding: 0;
        }

        body { display: flex; }

        .sidebar {
            width: 250px; min-width: 250px; background: var(--sidebar-bg);
            border-right: 1px solid var(--border-color);
            display: flex; flex-direction: column;
            padding: 15px 12px; gap: 8px; z-index: 100; 
            overflow-y: auto !important; 
            touch-action: pan-y !important;
            -webkit-overflow-scrolling: touch;
        }

        .brand-logo { font-size: 18px; font-weight: 900; letter-spacing: 1.5px; color: #fff; margin-bottom: 5px; }
        .brand-logo span { color: var(--accent-pink); }
        .category-title { font-size: 9px; font-weight: 800; color: var(--text-muted); letter-spacing: 1px; text-transform: uppercase; margin-top: 6px; }

        .spawn-btn, .grid-toggle-btn {
            background: #1c1f2b; border: 1px solid var(--border-color);
            color: var(--text-main); padding: 8px 10px; border-radius: 6px;
            font-size: 11px; font-weight: 600; text-align: left; cursor: pointer;
            transition: all 0.15s ease;
            touch-action: manipulation;
            flex-shrink: 0;
        }
        .spawn-btn:hover, .grid-toggle-btn:hover { border-color: var(--accent-cyan); color: var(--accent-cyan); background: #222636; }
        .grid-toggle-btn { text-align: center; background: #242836; font-weight: 700; margin-bottom: 6px; }

        #viewport {
            flex: 1; position: relative; overflow: hidden;
            background-color: var(--bg-dark); cursor: grab; touch-action: none;
            transition: background-color 0.2s ease;
        }
        #viewport.panning { cursor: grabbing; }

        #world {
            position: absolute; top: 0; left: 0; width: 0; height: 0;
            transform-origin: 0 0;
        }

        .infinite-grid {
            position: absolute; top: -50000px; left: -50000px;
            width: 100000px; height: 100000px;
            background-image: linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px), 
                              linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 20px 20px; pointer-events: none;
        }

        .master-oscilloscope {
            position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
            width: 380px; height: 48px; background: rgba(11, 12, 16, 0.85);
            border: 1px solid var(--accent-cyan); border-radius: 6px;
            box-shadow: 0 0 12px rgba(0, 240, 255, 0.15); z-index: 90; pointer-events: none;
        }
        .scope-title { font-size: 8px; font-weight: 800; color: var(--accent-cyan); letter-spacing: 1px; padding: 3px 6px 0 6px; }
        canvas#scopeCanvas { width: 100%; height: 30px; }

        .preset-container {
            position: absolute; top: 12px; right: 12px; display: flex;
            flex-direction: column; gap: 5px; width: 130px; z-index: 90;
        }
        .preset-btn {
            background: var(--accent-cyan); color: #000; border: none;
            padding: 5px 8px; border-radius: 4px; font-size: 10px; font-weight: 700; cursor: pointer;
            touch-action: manipulation;
        }
        .preset-btn.danger { background: rgba(255, 51, 68, 0.15); color: var(--accent-red); border: 1px solid var(--accent-red); }

        .zoom-controls {
            position: absolute; bottom: 12px; right: 12px; display: flex;
            gap: 6px; z-index: 90; background: rgba(19,21,28,0.8); padding: 4px; border-radius: 6px; border: 1px solid var(--border-color);
        }
        .zoom-btn { background: #1c1f2b; color: #fff; border: 1px solid var(--border-color); width: 26px; height: 26px; border-radius: 4px; font-weight: bold; cursor: pointer; touch-action: manipulation; }
        .zoom-btn:hover { border-color: var(--accent-cyan); color: var(--accent-cyan); }

        #svgCanvas { 
            position: absolute; top: -50000px; left: -50000px;
            width: 100000px; height: 100000px;
            pointer-events: none; z-index: 50; 
        }
        
        path.cable {
            fill: none; stroke: var(--accent-yellow); stroke-width: 4;
            stroke-linecap: round; filter: drop-shadow(0 2px 5px rgba(0,0,0,0.8));
            pointer-events: stroke; cursor: pointer;
        }
        path.cable.dragging { pointer-events: none; }
        path.cable:hover { stroke: var(--accent-red); stroke-width: 6; }

        .node {
            position: absolute; background: var(--panel-bg); border: 1px solid var(--border-color);
            border-radius: 8px; width: 270px; min-width: 200px; min-height: 140px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            z-index: 10; display: flex; flex-direction: column; touch-action: none;
            resize: both; overflow: hidden;
            transition: background 0.3s, color 0.3s, border-color 0.3s, box-shadow 0.2s ease-out;
        }
        .node.theme-light { background: #e8ecf2 !important; color: #111 !important; border-color: #a0aab8 !important; }
        .node.theme-light .node-header { background: rgba(0,0,0,0.06) !important; color: #111 !important; border-bottom-color: #a0aab8 !important; }
        .node.theme-light select, .node.theme-light input[type=number] { background: #fff !important; color: #111 !important; border-color: #ccc !important; }
        
        .node.theme-random { border-color: var(--accent-pink) !important; }

        @keyframes nodeFlashAnim {
            0% { box-shadow: 0 0 35px var(--accent-cyan); border-color: #fff; }
            100% { box-shadow: 0 10px 30px rgba(0,0,0,0.6); }
        }
        .node-spawn-flash { animation: nodeFlashAnim 0.6s ease-out forwards; }

        .node-header {
            background: rgba(255,255,255,0.03); border-bottom: 1px solid var(--border-color);
            padding: 6px 10px; font-size: 11px; font-weight: 700; cursor: grab;
            display: flex; justify-content: space-between; align-items: center; border-radius: 8px 8px 0 0;
            flex-shrink: 0; touch-action: none;
        }
        .close-btn { color: var(--accent-red); cursor: pointer; font-weight: bold; font-size: 14px; padding: 4px; }
        .close-btn:hover { background: rgba(255, 51, 68, 0.2); border-radius: 3px; }

        .node-body { 
            padding: 10px; display: flex; flex-direction: column; gap: 8px; font-size: 10px; flex: 1; 
            overflow-y: auto !important; 
            touch-action: pan-y !important;
            -webkit-overflow-scrolling: touch;
        }
        .ports-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2px; }
        .port-group { display: flex; align-items: center; gap: 4px; font-size: 9px; color: var(--text-muted); font-weight: bold; }
        
        .port {
            width: 22px; height: 22px; background: #000; border: 2px solid var(--text-main);
            border-radius: 50%; cursor: pointer; display: inline-block; touch-action: none;
            box-sizing: border-box; flex-shrink: 0;
        }
        .port.out { border-color: var(--accent-pink); }
        .port.in { border-color: var(--accent-cyan); }
        .port:hover { transform: scale(1.25); background: var(--accent-yellow); }

        .theme-btn-group { display: flex; gap: 3px; margin-top: 4px; }
        .theme-btn { background: #1c1f2b; color: #aaa; border: 1px solid var(--border-color); border-radius: 3px; font-size: 8px; padding: 2px 4px; cursor: pointer; }
        .theme-btn:hover { color: #fff; border-color: var(--accent-cyan); }

        .mixer-channel { background: #0c0d12; border: 1px solid var(--border-color); padding: 6px; border-radius: 4px; margin-top: 4px; }
        .row-flex { display: flex; justify-content: space-between; align-items: center; gap: 4px; margin: 2px 0; }
        
        input[type=range] { 
            accent-color: var(--accent-cyan); width: 100px; height: 24px; touch-action: pan-x; 
        }
        select, input[type=number] { 
            background: #08090c; color: #fff; border: 1px solid var(--border-color); padding: 4px; font-size: 11px; border-radius: 4px; touch-action: manipulation;
        }
        
        .mini-seq { display: grid; grid-template-columns: repeat(8, 1fr); gap: 2px; flex: 1; }
        .step-cell { aspect-ratio: 1; background: #08090c; border: 1px solid #242836; border-radius: 2px; cursor: pointer; touch-action: manipulation; }
        .step-cell.active { background: var(--accent-green); box-shadow: 0 0 5px var(--accent-green); }
        .step-cell.playing { border-color: var(--accent-yellow); transform: scale(1.1); }

        .ribbon-bar { width: 100%; height: 42px; background: linear-gradient(90deg, #ff2a74, #00f0ff, #ffe600); border-radius: 4px; cursor: pointer; touch-action: none; position: relative; }

        .btn-act { background: var(--accent-cyan); color: #000; border: none; padding: 6px 8px; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 10px; width: 100%; margin-top: 2px; touch-action: manipulation; }
        .xy-pad { width: 100%; height: 80px; background: #08090c; border: 1px solid var(--border-color); position: relative; border-radius: 4px; cursor: crosshair; touch-action: none; flex-shrink: 0; }
        .xy-pointer { width: 12px; height: 12px; background: var(--accent-pink); border: 1px solid #fff; border-radius: 50%; position: absolute; transform: translate(-50%, -50%); pointer-events: none; }
        .eq-canvas { width: 100%; height: 60px; background: #08090c; border: 1px solid var(--border-color); border-radius: 4px; cursor: pointer; }
        
        .lfo-scope-canvas { width: 100%; height: 35px; background: #08090c; border: 1px solid var(--border-color); border-radius: 4px; }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="brand-logo">MODULAR<span>LAB</span></div>

        <button class="grid-toggle-btn" onclick="toggleGridTheme()">🌗 Grid Theme: Dark / Light</button>

        <div class="category-title">MODULATION & UTILITY</div>
        <button class="spawn-btn" onclick="createNode('lfo')">+ LFO Oscillator</button>

        <div class="category-title">SOUND GENERATORS</div>
        <button class="spawn-btn" onclick="createNode('osc')">+ Oscillator Pro</button>
        <button class="spawn-btn" onclick="createNode('ribbon')">+ Ribbon Synthesizer</button>
        <button class="spawn-btn" onclick="createNode('drums')">+ Drum Machine 808</button>
        <button class="spawn-btn" onclick="createNode('soup')">+ Soup Generator</button>
        <button class="spawn-btn" onclick="createNode('granular')">+ Granular Synth</button>
        <button class="spawn-btn" onclick="createNode('dodeca')">+ Dodecaphonic Row</button>
        <button class="spawn-btn" onclick="createNode('chaos')">+ Radical Chaos Engine</button>

        <div class="category-title">CONTROLLERS & SEQUENCERS</div>
        <button class="spawn-btn" onclick="createNode('seq')">+ 8-Step Sequencer</button>

        <div class="category-title">EFFECTS & AUDIO PROCESSING</div>
        <button class="spawn-btn" onclick="createNode('visualeq')">+ Visual EQ 3-Band</button>
        <button class="spawn-btn" onclick="createNode('degrader')">+ Degrader (LFO Shaper)</button>
        <button class="spawn-btn" onclick="createNode('pitchshift')">+ Pitch Shifter (LFO)</button>
        <button class="spawn-btn" onclick="createNode('reverb')">+ Reverb Engine</button>
        <button class="spawn-btn" onclick="createNode('pingpong')">+ Ping-Pong Delay</button>
        <button class="spawn-btn" onclick="createNode('filter')">+ Biquad Filter</button>
        <button class="spawn-btn" onclick="createNode('delay')">+ Echo Delay</button>

        <div class="category-title">MIXING & OUTPUT</div>
        <button class="spawn-btn" onclick="createNode('mixer')">+ Mixer Channel Strip</button>
        <button class="spawn-btn" onclick="createNode('master')">+ Master Output</button>
    </div>

    <div id="viewport">
        <div id="world">
            <div class="infinite-grid"></div>
            <svg id="svgCanvas"></svg>
        </div>

        <div class="master-oscilloscope">
            <div class="scope-title">MASTER OSCILLOSCOPE</div>
            <canvas id="scopeCanvas"></canvas>
        </div>

        <div class="preset-container">
            <button class="preset-btn" onclick="loadPreset()">Default Setup</button>
            <button class="preset-btn danger" onclick="clearCanvas()">Clear All</button>
        </div>

        <div class="zoom-controls">
            <button class="zoom-btn" onclick="setZoom(scale + 0.15)">+</button>
            <button class="zoom-btn" onclick="resetZoom()">100%</button>
            <button class="zoom-btn" onclick="setZoom(scale - 0.15)">-</button>
        </div>
    </div>

    <script>
        let isGridLight = false;
        function toggleGridTheme() {
            isGridLight = !isGridLight;
            document.body.classList.toggle('grid-light-theme', isGridLight);
        }

        document.addEventListener('touchmove', function(e) { 
            if (e.target.closest('.sidebar') || e.target.closest('.node-body')) {
                return;
            }
            if (e.cancelable) {
                e.preventDefault(); 
            }
        }, { passive: false });

        let scale = 1;
        let panX = 0;
        let panY = 0;
        let isSpacePressed = false;
        let isPanning = false;
        let startPan = { x: 0, y: 0 };

        const viewport = document.getElementById('viewport');
        const world = document.getElementById('world');

        function updateWorldTransform() {
            world.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
        }

        function setZoom(newScale, cx = viewport.clientWidth / 2, cy = viewport.clientHeight / 2) {
            const clampedScale = Math.min(Math.max(newScale, 0.2), 3);
            const worldX = (cx - panX) / scale;
            const worldY = (cy - panY) / scale;

            scale = clampedScale;
            panX = cx - worldX * scale;
            panY = cy - worldY * scale;

            updateWorldTransform();
            updateCables();
        }

        function resetZoom() {
            scale = 1; panX = 0; panY = 0;
            updateWorldTransform();
            updateCables();
        }

        window.addEventListener('keydown', (e) => { if (e.code === 'Space') isSpacePressed = true; });
        window.addEventListener('keyup', (e) => { if (e.code === 'Space') isSpacePressed = false; });

        viewport.addEventListener('wheel', (e) => {
            e.preventDefault();
            const zoomFactor = e.deltaY < 0 ? 1.1 : 0.9;
            setZoom(scale * zoomFactor, e.clientX - viewport.getBoundingClientRect().left, e.clientY - viewport.getBoundingClientRect().top);
        }, { passive: false });

        viewport.addEventListener('mousedown', (e) => {
            if (e.target === viewport || e.target.classList.contains('infinite-grid') || isSpacePressed || e.button === 1) {
                isPanning = true;
                viewport.classList.add('panning');
                startPan = { x: e.clientX - panX, y: e.clientY - panY };
            }
        });

        window.addEventListener('mousemove', (e) => {
            if (isPanning) {
                panX = e.clientX - startPan.x;
                panY = e.clientY - startPan.y;
                updateWorldTransform();
            }
        });

        window.addEventListener('mouseup', () => {
            isPanning = false;
            viewport.classList.remove('panning');
        });

        let touchStartDist = 0;
        viewport.addEventListener('touchstart', (e) => {
            if (e.touches.length === 2) {
                touchStartDist = Math.hypot(
                    e.touches[0].clientX - e.touches[1].clientX,
                    e.touches[0].clientY - e.touches[1].clientY
                );
            } else if (e.target === viewport || e.target.classList.contains('infinite-grid')) {
                isPanning = true;
                startPan = { x: e.touches[0].clientX - panX, y: e.touches[0].clientY - panY };
            }
        }, { passive: false });

        viewport.addEventListener('touchmove', (e) => {
            if (e.touches.length === 2) {
                if (e.cancelable) e.preventDefault();
                const dist = Math.hypot(
                    e.touches[0].clientX - e.touches[1].clientX,
                    e.touches[0].clientY - e.touches[1].clientY
                );
                const factor = dist / touchStartDist;
                const midX = (e.touches[0].clientX + e.touches[1].clientX) / 2 - viewport.getBoundingClientRect().left;
                const midY = (e.touches[0].clientY + e.touches[1].clientY) / 2 - viewport.getBoundingClientRect().top;
                setZoom(scale * factor, midX, midY);
                touchStartDist = dist;
            } else if (isPanning && e.touches.length === 1) {
                if (e.cancelable) e.preventDefault();
                panX = e.touches[0].clientX - startPan.x;
                panY = e.touches[0].clientY - startPan.y;
                updateWorldTransform();
            }
        }, { passive: false });

        viewport.addEventListener('touchend', () => { isPanning = false; });

        let audioCtx = null;
        let analyserNode = null;
        const nodesRegistry = {};
        const activeCables = [];

        function getAudioContext() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                analyserNode = audioCtx.createAnalyser();
                analyserNode.fftSize = 256;
                drawScope();
            }
            if (audioCtx.state === 'suspended') audioCtx.resume();
            return audioCtx;
        }

        function drawScope() {
            const canvas = document.getElementById('scopeCanvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            const bufferLength = analyserNode.frequencyBinCount;
            const dataArray = new Uint8Array(bufferLength);

            function render() {
                if (!analyserNode) return;
                requestAnimationFrame(render);
                analyserNode.getByteTimeDomainData(dataArray);
                ctx.fillStyle = '#0b0c10'; ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.lineWidth = 1.5; ctx.strokeStyle = '#00f0ff'; ctx.beginPath();
                let sliceWidth = canvas.width / bufferLength, x = 0;
                for (let i = 0; i < bufferLength; i++) {
                    let v = dataArray[i] / 128.0, y = v * canvas.height / 2;
                    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
                    x += sliceWidth;
                }
                ctx.lineTo(canvas.width, canvas.height / 2); ctx.stroke();
            }
            render();
        }

        function updateLfoRate(id, val) {
            if (!nodesRegistry[id]) return;
            const param = nodesRegistry[id].lfoOsc.frequency;
            param.setTargetAtTime(parseFloat(val), audioCtx.currentTime, 0.015);
        }

        function updateLfoDepth(id, val) {
            if (!nodesRegistry[id]) return;
            const param = nodesRegistry[id].lfoGain.gain;
            param.setTargetAtTime(parseFloat(val), audioCtx.currentTime, 0.015);
        }

        function setNodeTheme(nodeId, theme) {
            const nodeEl = document.getElementById(nodeId);
            if (!nodeEl) return;
            nodeEl.classList.remove('theme-light', 'theme-random');
            if (theme === 'light') {
                nodeEl.classList.add('theme-light');
                nodeEl.style.borderColor = '';
                nodeEl.style.boxShadow = '';
            } else if (theme === 'random') {
                nodeEl.classList.add('theme-random');
                const randomHue = Math.floor(Math.random() * 360);
                const randomSat = Math.floor(Math.random() * 30) + 70;
                const randomLight = Math.floor(Math.random() * 20) + 50;
                nodeEl.style.borderColor = `hsl(${randomHue}, ${randomSat}%, ${randomLight}%)`;
                nodeEl.style.boxShadow = `0 10px 25px hsl(${randomHue}, ${randomSat}%, 20%)`;
            } else {
                nodeEl.style.borderColor = '';
                nodeEl.style.boxShadow = '';
            }
        }

        let nodeCounter = 0;
        function createNode(type, worldX, worldY) {
            getAudioContext();
            nodeCounter++;
            const id = `node_${nodeCounter}`;
            const node = document.createElement('div');
            node.className = 'node node-spawn-flash'; node.id = id;
            
            setTimeout(() => node.classList.remove('node-spawn-flash'), 650);

            const posX = worldX !== undefined ? worldX : (-panX + viewport.clientWidth / 2 - 100) / scale;
            const posY = worldY !== undefined ? worldY : (-panY + viewport.clientHeight / 2 - 100) / scale;

            node.style.left = posX + 'px';
            node.style.top = posY + 'px';

            new ResizeObserver(() => updateCables()).observe(node);

            let bodyHTML = '';
            let audioObj = { 
                input: audioCtx.createGain(), 
                output: audioCtx.createGain(),
                type: type,
                isPlaying: false
            };

            if (type === 'lfo') {
                const lfoOsc = audioCtx.createOscillator();
                const lfoGain = audioCtx.createGain();
                
                lfoOsc.type = 'sine';
                lfoOsc.frequency.value = 2;
                lfoGain.gain.value = 600; 

                lfoOsc.connect(lfoGain);
                
                audioObj.output = lfoGain; 
                audioObj.isModulator = true;
                audioObj.lfoOsc = lfoOsc;
                audioObj.lfoGain = lfoGain;

                lfoOsc.start();

                bodyHTML = `
                    <canvas class="lfo-scope-canvas" id="lfo_canvas_${id}"></canvas>
                    <div class="row-flex">RATE (Hz): 
                        <input type="range" min="0.1" max="20" step="0.1" value="2" 
                        oninput="updateLfoRate('${id}', this.value)">
                    </div>
                    <div class="row-flex">DEPTH: 
                        <input type="range" min="1" max="2400" step="10" value="600" 
                        oninput="updateLfoDepth('${id}', this.value)">
                    </div>
                    <div class="row-flex">WAVE: 
                        <select onchange="nodesRegistry['${id}'].lfoOsc.type=this.value">
                            <option>sine</option>
                            <option>triangle</option>
                            <option>square</option>
                            <option>sawtooth</option>
                        </select>
                    </div>`;
            }
            else if (type === 'ribbon') {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sawtooth';
                gain.gain.value = 0;
                osc.start();
                osc.connect(gain);
                gain.connect(audioObj.output);
                audioObj.osc = osc;
                audioObj.gain = gain;
                audioObj.isHold = false;

                bodyHTML = `
                    <div class="ribbon-bar" id="ribbon_bar_${id}"></div>
                    <div class="row-flex">
                        <span>HOLD NOTE</span>
                        <input type="checkbox" id="ribbon_hold_${id}" onchange="nodesRegistry['${id}'].isHold = this.checked; if(!this.checked) nodesRegistry['${id}'].gain.gain.value=0;">
                    </div>
                    <div class="row-flex">WAVE: 
                        <select onchange="nodesRegistry['${id}'].osc.type=this.value">
                            <option>sawtooth</option>
                            <option>sine</option>

        function initRibbon(id) {
            setTimeout(() => {
                const bar = document.getElementById(`ribbon_bar_${id}`);
                if (!bar) return;
                const nObj = nodesRegistry[id];

                const playRibbon = (e) => {
                    const rect = bar.getBoundingClientRect();
                    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                    let normX = Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
                    let freq = 130.81 * Math.pow(2, normX * 3);
                    nObj.osc.frequency.setTargetAtTime(freq, audioCtx.currentTime, 0.01);
                    nObj.gain.gain.setTargetAtTime(0.5, audioCtx.currentTime, 0.01);
                };

                const stopRibbon = () => {
                    if (!nObj.isHold) {
                        nObj.gain.gain.setTargetAtTime(0, audioCtx.currentTime, 0.05);
                    }
                };

                bar.onmousedown = (e) => { playRibbon(e); };
                bar.onmousemove = (e) => { if (e.buttons === 1) playRibbon(e); };
                bar.onmouseup = stopRibbon;
                bar.onmouseleave = stopRibbon;

                bar.addEventListener('touchstart', (e) => { e.preventDefault(); playRibbon(e); }, { passive: false });
                bar.addEventListener('touchmove', (e) => { e.preventDefault(); playRibbon(e); }, { passive: false });
                bar.addEventListener('touchend', stopRibbon);
            }, 50);
        }

        function initLfoScope(id) {
            setTimeout(() => {
                const canvas = document.getElementById(`lfo_canvas_${id}`);
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                let phase = 0;

                function renderLfo() {
                    if (!nodesRegistry[id]) return;
                    requestAnimationFrame(renderLfo);
                    ctx.fillStyle = '#08090c'; ctx.fillRect(0, 0, canvas.width, canvas.height);
                    ctx.strokeStyle = '#00e676'; ctx.lineWidth = 1.5; ctx.beginPath();

                    let rate = 2;
                    if (nodesRegistry[id].lfoOsc) rate = nodesRegistry[id].lfoOsc.frequency.value;
                    phase += rate * 0.05;

                    for (let x = 0; x < canvas.width; x++) {
                        let y = (canvas.height / 2) + Math.sin(phase + (x * 0.1)) * (canvas.height / 3);
                        if (x === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
                    }
                    ctx.stroke();
                }
                renderLfo();
            }, 50);
        }

        function initVisualEQ(id) {
            setTimeout(() => {
                const canvas = document.getElementById(`eq_canvas_${id}`);
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                const nObj = nodesRegistry[id];
                const analyser = nObj.eqAnalyser;
                const bufferLength = analyser.frequencyBinCount;
                const dataArray = new Uint8Array(bufferLength);

                let draggingPoint = null;

                function drawEQ() {
                    if (!nodesRegistry[id]) return;
                    requestAnimationFrame(drawEQ);
                    analyser.getByteFrequencyData(dataArray);

                    ctx.fillStyle = '#08090c'; ctx.fillRect(0, 0, canvas.width, canvas.height);

                    ctx.strokeStyle = 'rgba(0, 240, 255, 0.2)'; ctx.lineWidth = 1; ctx.beginPath();
                    for (let i = 0; i < bufferLength; i++) {
                        let x = (i / bufferLength) * canvas.width;
                        let y = canvas.height - ((dataArray[i] / 255) * canvas.height);
                        if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
                    }
                    ctx.stroke();

                    const lowY = canvas.height / 2 - (nObj.low.gain.value * 1.2);
                    const midY = canvas.height / 2 - (nObj.mid.gain.value * 1.2);
                    const highY = canvas.height / 2 - (nObj.high.gain.value * 1.2);

                    const pLow = { x: canvas.width * 0.2, y: Math.max(5, Math.min(canvas.height - 5, lowY)) };
                    const pMid = { x: canvas.width * 0.5, y: Math.max(5, Math.min(canvas.height - 5, midY)) };
                    const pHigh = { x: canvas.width * 0.8, y: Math.max(5, Math.min(canvas.height - 5, highY)) };

                    ctx.strokeStyle = '#ffe600'; ctx.lineWidth = 2; ctx.beginPath();
                    ctx.moveTo(0, pLow.y);
                    ctx.quadraticCurveTo(pLow.x, pLow.y, pMid.x, pMid.y);
                    ctx.quadraticCurveTo(pHigh.x, pHigh.y, canvas.width, pHigh.y);
                    ctx.stroke();

                    [pLow, pMid, pHigh].forEach((p, idx) => {
                        ctx.fillStyle = idx === 0 ? '#ff2a74' : (idx === 1 ? '#ffe600' : '#00f0ff');
                        ctx.beginPath(); ctx.arc(p.x, p.y, 5, 0, Math.PI * 2); ctx.fill();
                    });
                }
                drawEQ();

                const handlePointer = (e) => {
                    const rect = canvas.getBoundingClientRect();
                    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                    const relX = clientX - rect.left;
                    const relY = clientY - rect.top;

                    let normGain = Math.max(-24, Math.min(24, (canvas.height / 2 - relY) / 1.2));

                    if (draggingPoint === 'low' || relX < canvas.width * 0.35) {
                        nObj.low.gain.value = normGain;
                        document.getElementById(`eq_low_${id}`).value = normGain;
                    } else if (draggingPoint === 'mid' || (relX >= canvas.width * 0.35 && relX < canvas.width * 0.65)) {
                        nObj.mid.gain.value = normGain;
                        document.getElementById(`eq_mid_${id}`).value = normGain;
                    } else {
                        nObj.high.gain.value = normGain;
                        document.getElementById(`eq_high_${id}`).value = normGain;
                    }
                };

                canvas.onmousedown = (e) => { draggingPoint = true; handlePointer(e); };
                window.addEventListener('mousemove', (e) => { if (draggingPoint) handlePointer(e); });
                window.addEventListener('mouseup', () => { draggingPoint = null; });
            }, 50);
        }

        function createImpulseBuffer(duration, decay) {
            const sampleRate = audioCtx.sampleRate;
            const length = sampleRate * duration;
            const impulse = audioCtx.createBuffer(2, length, sampleRate);
            const left = impulse.getChannelData(0); const right = impulse.getChannelData(1);
            for (let i = 0; i < length; i++) {
                let n = length - i;
                left[i] = (Math.random() * 2 - 1) * Math.pow(n / length, decay);
                right[i] = (Math.random() * 2 - 1) * Math.pow(n / length, decay);
            }
            return impulse;
        }

        function toggleChaosLoop(nodeId) {
            let nObj = nodesRegistry[nodeId];
            let btn = document.getElementById(`btn_chaos_${nodeId}`);
            if (nObj.isPlaying) { nObj.isPlaying = false; btn.innerText = "RUN CHAOS 🌀"; return; }
            nObj.isPlaying = true; btn.innerText = "STOP CHAOS ⏹";

            function chaosStep() {
                if (!nObj.isPlaying) return;
                const pad = document.getElementById(`xypad_${nodeId}`);
                const ptr = document.getElementById(`xyptr_${nodeId}`);
                if (pad && ptr) {
                    const rx = Math.random() * pad.clientWidth;
                    const ry = Math.random() * pad.clientHeight;
                    ptr.style.left = rx + 'px'; ptr.style.top = ry + 'px';
                    const normX = rx / pad.clientWidth; const normY = 1 - (ry / pad.clientHeight);
                    nObj.chaosFilter.frequency.value = normX * 5000 + 100;
                    nObj.chaosFilter.Q.value = normY * 30 + 0.5;
                }
                setTimeout(chaosStep, 150);
            }
            chaosStep();
        }

        function toggleSoupLoop(nodeId) {
            let nObj = nodesRegistry[nodeId];
            let btn = document.getElementById(`btn_soup_${nodeId}`);
            if (nObj.isPlaying) { nObj.isPlaying = false; btn.innerText = "RUN SOUP LOOP 🥣"; return; }
            nObj.isPlaying = true; btn.innerText = "STOP SOUP LOOP ⏹";

            function soupLoop() {
                if (!nObj.isPlaying) return;
                const rndDrive = Math.floor(Math.random() * 45) + 1;
                const rndCut = Math.floor(Math.random() * 5000) + 200;
                document.getElementById(`soup_visc_${nodeId}`).value = rndDrive;
                document.getElementById(`soup_cut_${nodeId}`).value = rndCut;
                updateSoupDrive(nodeId, rndDrive);
                nObj.soupFilter.frequency.value = rndCut;
                playSound(nodeId, 150 + Math.random() * 600, 0.2);
                setTimeout(soupLoop, 200);
            }
            soupLoop();
        }

        function toggleDodecaLoop(nodeId) {
            let nObj = nodesRegistry[nodeId];
            let btn = document.getElementById(`btn_dodeca_${nodeId}`);
            if (nObj.isPlaying) { nObj.isPlaying = false; btn.innerText = "RUN DODECA LOOP 🎼"; return; }
            nObj.isPlaying = true; btn.innerText = "STOP DODECA ⏹";

            const baseNotes = [261.63, 277.18, 293.66, 311.13, 329.63, 349.23, 369.99, 392.00, 415.30, 440.00, 466.16, 493.88];
            let currentSeries = [];

            function nextNote() {
                if (!nObj.isPlaying) return;
                if (currentSeries.length === 0) currentSeries = [...baseNotes].sort(() => Math.random() - 0.5);
                const freq = currentSeries.pop();
                
                playSound(nodeId, freq, 0.15);
                
                if (nObj.playMelody2) {
                    setTimeout(() => playSound(nodeId, freq * 1.5, 0.12), 75);
                }
                if (nObj.playAccompany) {
                    playSound(nodeId, freq * 0.5, 0.3);
                }

                setTimeout(nextNote, 150);
            }
            nextNote();
        }

        function toggleGranular(nodeId) {
            let nObj = nodesRegistry[nodeId];
            let btn = document.getElementById(`btn_gran_${nodeId}`);
            if (nObj.isPlaying) { nObj.isPlaying = false; btn.innerText = "START GRANULAR PROCESSING 🔊"; return; }
            nObj.isPlaying = true; btn.innerText = "STOP GRANULAR ⏹";

            function grainLoop() {
                if (!nObj.isPlaying) return;
                const size = nObj.grainSize || 0.08; const dens = nObj.density || 60;
                const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
                osc.frequency.value = 100 + Math.random() * 800;
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + size);
                osc.connect(gain); gain.connect(nObj.output);
                osc.start(); osc.stop(audioCtx.currentTime + size);
                setTimeout(grainLoop, Math.max(20, 10000 / dens));
            }
            grainLoop();
        }

        function initXYPad(nodeId) {
            setTimeout(() => {
                const pad = document.getElementById(`xypad_${nodeId}`);
                const ptr = document.getElementById(`xyptr_${nodeId}`);
                if (!pad) return;

                const updateXY = (e) => {
                    const rect = pad.getBoundingClientRect();
                    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                    const clientY = e.touches ? e.touches[0].clientY : e.clientY;

                    let x = Math.max(0, Math.min(clientX - rect.left, rect.width));
                    let y = Math.max(0, Math.min(clientY - rect.top, rect.height));

                    ptr.style.left = x + 'px'; ptr.style.top = y + 'px';
                    const normX = x / rect.width; const normY = 1 - (y / rect.height);

                    if (nodesRegistry[nodeId] && nodesRegistry[nodeId].chaosFilter) {
                        nodesRegistry[nodeId].chaosFilter.frequency.value = normX * 4000 + 100;
                        nodesRegistry[nodeId].chaosFilter.Q.value = normY * 25 + 0.5;
                    }
                };

                let isInteracting = false;
                pad.onmousedown = (e) => { isInteracting = true; updateXY(e); };
                window.addEventListener('mousemove', (e) => { if (isInteracting) updateXY(e); });
                window.addEventListener('mouseup', () => { isInteracting = false; });
                
                pad.addEventListener('touchstart', (e) => { isInteracting = true; updateXY(e); }, {passive: false});
                window.addEventListener('touchmove', (e) => { if (isInteracting) { if (e.cancelable) e.preventDefault(); updateXY(e); } }, {passive: false});
                window.addEventListener('touchend', () => { isInteracting = false; });
            }, 50);
        }

        function updateSoupDrive(nodeId, val) {
            if (!nodesRegistry[nodeId] || !nodesRegistry[nodeId].soupShaper) return;
            const k = parseFloat(val); const n_samples = 44100; const curve = new Float32Array(n_samples); const deg = Math.PI / 180;
            for (let i = 0; i < n_samples; ++i) {
                let x = (i * 2) / n_samples - 1;
                curve[i] = ((3 + k) * x * 20 * deg) / (Math.PI + k * Math.abs(x));
            }
            nodesRegistry[nodeId].soupShaper.curve = curve;
        }

        function removeNode(nodeId) {
            for (let i = activeCables.length - 1; i >= 0; i--) {
                const c = activeCables[i];
                if (c.fromNodeId === nodeId || c.toNodeId === nodeId) removeCable(c);
            }
            if (nodesRegistry[nodeId]) {
                nodesRegistry[nodeId].isPlaying = false;
                try { nodesRegistry[nodeId].input.disconnect(); } catch(e){}
                try { nodesRegistry[nodeId].output.disconnect(); } catch(e){}
                delete nodesRegistry[nodeId];
            }
            const el = document.getElementById(nodeId);
            if (el) el.remove();
        }

        let mixChanCounter = 0;
        function addMixerChannel(nodeId) {
            mixChanCounter++;
            const chanId = `ch_${mixChanCounter}`;
            const container = document.getElementById(`mix_chans_${nodeId}`);
            const chanGain = audioCtx.createGain();
            const chanEQ = audioCtx.createBiquadFilter();
            chanEQ.type = "peaking"; chanEQ.frequency.value = 1000; chanEQ.gain.value = 0;
            chanEQ.connect(chanGain); chanGain.connect(nodesRegistry[nodeId].output);

            const chanObj = { inPortId: `in_${chanId}`, gainNode: chanGain, eqNode: chanEQ };
            nodesRegistry[nodeId].channels.push(chanObj);

            const chanEl = document.createElement('div');
            chanEl.className = 'mixer-channel';
            chanEl.innerHTML = `
                <div class="row-flex">
                    <span style="color:var(--accent-yellow)">CH ${nodesRegistry[nodeId].channels.length}</span>
                    <div class="port in" id="${chanObj.inPortId}" data-node="${nodeId}" data-chanindex="${nodesRegistry[nodeId].channels.length-1}"></div>
                </div>
                <div class="row-flex">VOL <input type="range" min="0" max="1" step="0.01" value="0.8" oninput="nodesRegistry['${nodeId}'].channels[${nodesRegistry[nodeId].channels.length-1}].gainNode.gain.value=this.value"></div>`;
            
            container.appendChild(chanEl);
            initPorts(chanEl);
        }

        function toggleDrumStep(nodeId, type, idx, el) {
            nodesRegistry[nodeId].steps[type][idx] = !nodesRegistry[nodeId].steps[type][idx];
            el.classList.toggle('active');
        }

        function triggerDrums(nodeId) {
            let nObj = nodesRegistry[nodeId];
            let btn = document.getElementById(`btn_drum_${nodeId}`);
            if (nObj.isPlaying) { 
                nObj.isPlaying = false; 
                btn.innerText = "PLAY DRUMS ▶"; btn.style.background = "var(--accent-cyan)";
                return; 
            }
            nObj.isPlaying = true; btn.innerText = "STOP DRUMS ⏹"; btn.style.background = "var(--accent-red)";
            let step = 0;

            function playKick808() {
                let osc = audioCtx.createOscillator(); let gain = audioCtx.createGain();
                osc.frequency.setValueAtTime(150, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(35, audioCtx.currentTime + 0.35);
                gain.gain.setValueAtTime(nObj.gains.bd, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.35);
                osc.connect(gain); gain.connect(nObj.output);
                osc.start(); osc.stop(audioCtx.currentTime + 0.35);
            }

            function playSnare808() {
                let osc = audioCtx.createOscillator(); osc.type = 'triangle';
                osc.frequency.setValueAtTime(180, audioCtx.currentTime);
                let oscGain = audioCtx.createGain(); oscGain.gain.setValueAtTime(nObj.gains.sd, audioCtx.currentTime);
                oscGain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                osc.connect(oscGain); oscGain.connect(nObj.output);
                osc.start(); osc.stop(audioCtx.currentTime + 0.1);

                let noiseBuffer = audioCtx.createBuffer(1, audioCtx.sampleRate * 0.2, audioCtx.sampleRate);
                let output = noiseBuffer.getChannelData(0);
                for (let i = 0; i < noiseBuffer.length; i++) output[i] = Math.random() * 2 - 1;
                let whiteNoise = audioCtx.createBufferSource(); whiteNoise.buffer = noiseBuffer;
                let filter = audioCtx.createBiquadFilter(); filter.type = 'highpass'; filter.frequency.value = 1000;
                let envelope = audioCtx.createGain(); envelope.gain.setValueAtTime(nObj.gains.sd * 0.7, audioCtx.currentTime);
                envelope.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
                whiteNoise.connect(filter); filter.connect(envelope); envelope.connect(nObj.output);
                whiteNoise.start(); whiteNoise.stop(audioCtx.currentTime + 0.2);
            }

            function playHiHat808() {
                let noiseBuffer = audioCtx.createBuffer(1, audioCtx.sampleRate * 0.05, audioCtx.sampleRate);
                let output = noiseBuffer.getChannelData(0);
                for (let i = 0; i < noiseBuffer.length; i++) output[i] = Math.random() * 2 - 1;
                let whiteNoise = audioCtx.createBufferSource(); whiteNoise.buffer = noiseBuffer;
                let filter = audioCtx.createBiquadFilter(); filter.type = 'highpass'; filter.frequency.value = 7500;
                let envelope = audioCtx.createGain(); envelope.gain.setValueAtTime(nObj.gains.hh, audioCtx.currentTime);
                envelope.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
                whiteNoise.connect(filter); filter.connect(envelope); envelope.connect(nObj.output);
                whiteNoise.start(); whiteNoise.stop(audioCtx.currentTime + 0.05);
            }

            function run() {
                if(!nObj.isPlaying) return;
                const bpm = parseInt(document.getElementById(`bpm_${nodeId}`).value) || 120;
                const st = nObj.steps;

                const nodeEl = document.getElementById(nodeId);
                if (nodeEl) {
                    nodeEl.querySelectorAll('.step-cell').forEach((c, idx) => {
                        if (idx % 8 === step) c.classList.add('playing');
                        else c.classList.remove('playing');
                    });
                }

                if(st.bd[step]) playKick808();
                if(st.sd[step]) playSnare808();
                if(st.hh[step]) playHiHat808();
                step = (step + 1) % 8;
                setTimeout(run, (60000 / bpm) / 4);
            }
            run();
        }

        function playSound(nodeId, freq, dur) {
            if (!nodesRegistry[nodeId]) return;
            let osc = audioCtx.createOscillator(); let g = audioCtx.createGain();
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + dur);
            g.gain.setValueAtTime(0.4, audioCtx.currentTime);
            osc.connect(g); g.connect(nodesRegistry[nodeId].output);
            osc.start(); osc.stop(audioCtx.currentTime + dur);
        }

        function toggleSeqStep(nodeId, idx, el) {
            nodesRegistry[nodeId].seqSteps[idx] = !nodesRegistry[nodeId].seqSteps[idx];
            el.classList.toggle('active');
        }

        function triggerSeq(nodeId) {
            let nObj = nodesRegistry[nodeId];
            let btn = document.getElementById(`btn_seq_${nodeId}`);
            if (nObj.isPlaying) { 
                nObj.isPlaying = false; btn.innerText = "RUN SEQUENCER ▶"; btn.style.background = "var(--accent-cyan)";
                return; 
            }
            nObj.isPlaying = true; btn.innerText = "STOP SEQUENCER ⏹"; btn.style.background = "var(--accent-red)";
            let idx = 0; const freqs = [220, 247, 277, 293, 329, 370, 415, 440];
            function loop() {
                if (!nObj.isPlaying) return;
                const bpm = parseInt(document.getElementById(`seq_bpm_${nodeId}`).value) || 140;
                
                for(let i=0; i<8; i++) {
                    let cell = document.getElementById(`seq_cell_${nodeId}_${i}`);
                    if (cell) {
                        if (i === idx) cell.classList.add('playing');
                        else cell.classList.remove('playing');
                    }
                }

                if (nObj.seqSteps[idx]) {
                    playSound(nodeId, freqs[idx], 0.1);
                }

                idx = (idx + 1) % freqs.length;
                setTimeout(loop, (60000 / bpm) / 2);
            }
            loop();
        }

        function makeDraggable(node) {
            const header = node.querySelector('.node-header');
            const startDrag = (e) => {
                if (e.target.classList.contains('close-btn')) return;
                e.stopPropagation();
                
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                let startLeft = parseFloat(node.style.left);
                let startTop = parseFloat(node.style.top);

                function moveAt(cx, cy) {
                    let dx = (cx - clientX) / scale;
                    let dy = (cy - clientY) / scale;
                    node.style.left = (startLeft + dx) + 'px';
                    node.style.top = (startTop + dy) + 'px';
                    updateCables();
                }

                function onMove(e) {
                    if (e.cancelable) e.preventDefault();
                    const cx = e.touches ? e.touches[0].clientX : e.clientX;
                    const cy = e.touches ? e.touches[0].clientY : e.clientY;
                    moveAt(cx, cy);
                }

                window.addEventListener('mousemove', onMove);
                window.addEventListener('touchmove', onMove, { passive: false });

                const stopDrag = () => {
                    window.removeEventListener('mousemove', onMove);
                    window.removeEventListener('touchmove', onMove);
                };
                window.onmouseup = stopDrag;
                window.ontouchend = stopDrag;
            };

            header.onmousedown = startDrag;
            header.ontouchstart = startDrag;
        }

        let draggingCable = null;
        function initPorts(scope) {
            scope.querySelectorAll('.port').forEach(port => {
                const startCable = (e) => {
                    e.stopPropagation();
                    if (e.cancelable) e.preventDefault();

                    if (port.classList.contains('out')) {
                        const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                        path.setAttribute('class', 'cable dragging');
                        document.getElementById('svgCanvas').appendChild(path);

                        draggingCable = {
                            fromPortId: port.id,
                            fromNodeId: port.dataset.node,
                            path: path
                        };
                    }
                };
                port.onmousedown = startCable;
                port.ontouchstart = startCable;
            });
        }

        const handleMove = (e) => {
            if (draggingCable) {
                if (e.cancelable) e.preventDefault();
                const cx = e.touches ? e.touches[0].clientX : e.clientX;
                const cy = e.touches ? e.touches[0].clientY : e.clientY;
                const p1 = getPortWorldCenter(document.getElementById(draggingCable.fromPortId));
                
                const viewportRect = viewport.getBoundingClientRect();
                const targetX = (cx - viewportRect.left - panX) / scale;
                const targetY = (cy - viewportRect.top - panY) / scale;

                drawBezier(draggingCable.path, p1.x, p1.y, targetX, targetY);
            }
        };
        window.addEventListener('mousemove', handleMove);
        window.addEventListener('touchmove', handleMove, { passive: false });

        const handleEnd = (e) => {
            if (draggingCable) {
                const cx = e.changedTouches ? e.changedTouches[0].clientX : e.clientX;
                const cy = e.changedTouches ? e.changedTouches[0].clientY : e.clientY;
                
                const targetPort = document.elementFromPoint(cx, cy);

                if (targetPort && targetPort.classList.contains('in')) {
                    const toNodeId = targetPort.dataset.node;
                    const chanIdx = targetPort.dataset.chanindex;
                    const fromNodeObj = nodesRegistry[draggingCable.fromNodeId];
                    const toNodeObj = nodesRegistry[toNodeId];

                    let targetAudio = toNodeObj.input;

                    if (fromNodeObj.isModulator) {
                        if (toNodeObj.type === 'filter') {
                            targetAudio = toNodeObj.flt.detune;
                        } else if (toNodeObj.type === 'osc' || toNodeObj.type === 'ribbon') {
                            targetAudio = toNodeObj.osc.detune;
                        } else {
                            draggingCable.path.remove();
                            draggingCable = null;
                            return;
                        }
                    } else if (chanIdx !== undefined) {
                        targetAudio = toNodeObj.channels[chanIdx].eqNode;
                    }

                    fromNodeObj.output.connect(targetAudio);
                    draggingCable.path.classList.remove('dragging');

                    const cableObj = {
                        fromPortId: draggingCable.fromPortId,
                        toPortId: targetPort.id,
                        fromNodeId: draggingCable.fromNodeId,
                        toNodeId: toNodeId,
                        path: draggingCable.path,
                        srcAudio: fromNodeObj.output,
                        targetAudio: targetAudio
                    };

                    draggingCable.path.onclick = () => removeCable(cableObj);
                    draggingCable.path.ontouchstart = (e) => { e.stopPropagation(); removeCable(cableObj); };

                    activeCables.push(cableObj);
                    updateCables();
                } else {
                    draggingCable.path.remove();
                }
                draggingCable = null;
            }
        };
        window.addEventListener('mouseup', handleEnd);
        window.addEventListener('touchend', handleEnd);

        function removeCable(cableObj) {
            try { cableObj.srcAudio.disconnect(cableObj.targetAudio); } catch(e){}
            cableObj.path.remove();
            const idx = activeCables.indexOf(cableObj);
            if(idx > -1) activeCables.splice(idx, 1);
        }

        function getPortWorldCenter(elem) {
            if (!elem) return { x: 0, y: 0 };
            const box = elem.getBoundingClientRect();
            const viewportRect = viewport.getBoundingClientRect();
            const screenX = box.left + box.width / 2 - viewportRect.left;
            const screenY = box.top + box.height / 2 - viewportRect.top;
            return {
                x: (screenX - panX) / scale,
                y: (screenY - panY) / scale
            };
        }

        function drawBezier(path, x1, y1, x2, y2) {
            const ox = 50000; const oy = 50000;
            const wx1 = x1 + ox; const wy1 = y1 + oy;
            const wx2 = x2 + ox; const wy2 = y2 + oy;
            const dx = Math.abs(wx2 - wx1) * 0.5;
            path.setAttribute('d', `M ${wx1} ${wy1} C ${wx1 + dx} ${wy1}, ${wx2 - dx} ${wy2}, ${wx2} ${wy2}`);
        }

        function updateCables() {
            activeCables.forEach(c => {
                const p1Elem = document.getElementById(c.fromPortId);
                const p2Elem = document.getElementById(c.toPortId);
                if (p1Elem && p2Elem) {
                    const p1 = getPortWorldCenter(p1Elem);
                    const p2 = getPortWorldCenter(p2Elem);
                    drawBezier(c.path, p1.x, p1.y, p2.x, p2.y);
                }
            });
        }

        function clearCanvas() {
            Object.keys(nodesRegistry).forEach(id => removeNode(id));
            document.querySelectorAll('.node').forEach(n => n.remove());
            document.querySelectorAll('path.cable').forEach(c => c.remove());
            activeCables.length = 0;

            if (audioCtx) {
                audioCtx.close();
                audioCtx = null;
            }
        }

        function loadPreset() {
            clearCanvas();
            setTimeout(() => {
                createNode('osc', 100, 100);
                createNode('lfo', 100, 280);
                createNode('visualeq', 420, 100);
                createNode('master', 740, 100);
            }, 50);
        }
    </script>
</body>
</html>
